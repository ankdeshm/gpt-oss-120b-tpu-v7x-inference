---
# Low-Latency 4 x tpu7x-standard-4t (16 physical Ironwood chips = 32 TensorCores) Deployment
# Engine: sglang-torchtpu (TP=8, EP=8 per 4-chip host + optional EAGLE3 Speculative Decoding)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt-oss-120b-sglang-v7x
  namespace: default
  labels:
    app: gpt-oss-120b-sglang-v7x
    engine: sglang-torchtpu
spec:
  replicas: 4
  selector:
    matchLabels:
      app: gpt-oss-120b-sglang-v7x
  template:
    metadata:
      labels:
        app: gpt-oss-120b-sglang-v7x
        engine: sglang-torchtpu
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
    spec:
      nodeSelector:
        cloud.google.com/tpu-accelerator: tpu7x
        cloud.google.com/tpu-topology: 2x2x1
      tolerations:
        - key: google.com/tpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sglang-server
          image: us-central1-docker.pkg.dev/<YOUR_PROJECT_ID>/vllm/sglang-torchtpu-diffusion:v0.2.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /dev/shm/torch_tpu_tier3
              export FORCE_SINGLE_HOST=1
              export SGLANG_TPU_FUSED_MOE_SC_GATHER=0
              export TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS=false
              export TORCH_TPU_TIER3_ROOT=/dev/shm/torch_tpu_tier3
              export MODEL=/models/models/openai/gpt-oss-120b
              export HOST=0.0.0.0 PORT=8000 TP_SIZE=8 EP_SIZE=8
              export QUANTIZATION="" KV_CACHE_DTYPE=fp8_e4m3
              export ATTENTION_BACKEND=pallas_tpu_rpa_v3 PAGE_SIZE=64
              export CONTEXT_LEN=32768 CHUNKED_PREFILL_SIZE=4096 MAX_PREFILL_TOKENS=4096 MAX_TOTAL_TOKENS=262144
              export MEM_FRACTION_STATIC=0.58 CONC=16 MAX_RUNNING=16 TORCH_COMPILE_MAX_BS=16
              export TPU_COMPILE_BS="1 2 4 6 8 16" TPU_COMPILE_TOKENS="512 2048 4096"
              export SGLANG_TPU_ALLOW_SPEC_RECOMPILE=1
              export DISABLE_RADIX_CACHE=1 ENABLE_TORCH_COMPILE=1 DUMP_META=0
              export EXTRA_ARGS="--tpu-compile-tracer direct --served-model-name openai/gpt-oss-120b --reasoning-parser gpt-oss --speculative-algorithm EAGLE3 --speculative-draft-model-path /models/models/lmsys/EAGLE3-gpt-oss-120b-bf16 --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4 --watchdog-timeout 7200"
              exec bash /workspace/sglang/benchmark/tpu/launch_server.sh
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 15
          resources:
            requests:
              google.com/tpu: "4"
              cpu: "110"
              memory: "420Gi"
            limits:
              google.com/tpu: "4"
          volumeMounts:
            - name: models-gcs
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models-gcs
          persistentVolumeClaim:
            claimName: tpu-v7x-models-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gpt-oss-120b-sglang-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: gpt-oss-120b-sglang-v7x
  ports:
    - name: http
      port: 8000
      targetPort: 8000
